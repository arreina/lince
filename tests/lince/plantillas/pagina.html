<html>
  <head><title>{{ titulo }}</title></head>
  <body>
    {{> cabecera.html}}
    <ul>
    {{#para t en tareas}}
      <li class="{{#si t.hecha}}hecha{{#sino}}pendiente{{/si}}">
        {{ @numero }}. {{ t.texto }}
        {{#si t.etiquetas}}
        <small>{{#para e en t.etiquetas}}#{{ e }} {{/para}}</small>
        {{/si}}
      </li>
    {{/para}}
    </ul>
    {{#si no tareas}}
    <p>No hay tareas.</p>
    {{/si}}
  </body>
</html>
