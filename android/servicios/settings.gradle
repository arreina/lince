// 🐆 Lince para Android: las variantes de la plantilla con bibliotecas de
// Google (anuncios, compras, o las dos). Solo lo usa construir.sh --plantilla:
// de lo que hace Gradle saca el manifiesto unido, los recursos y el código
// (ver android/LEEME.md). Un juego no pasa nunca por aquí.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "lince-servicios"
