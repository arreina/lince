<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580">
  <title>Lince — Logo oficial</title>
  <desc>Logo de Lince: L morada con virgulilla tricolor republicana (rojo, gualda, morado)</desc>

  <!-- ══ LOGO COMPLETO ══ -->
  <!-- L morada -->
  <path d="M 40,80 L 40,220 L 130,220 L 116,200 L 68,200 L 68,80 Z" fill="#6A2D72"/>
  <!-- Virgulilla tricolor: rojo · gualda · morado -->
  <path d="M 40,58 Q 52,38 64,58"  fill="none" stroke="#C60B1E" stroke-width="11" stroke-linecap="round"/>
  <path d="M 64,58 Q 76,78 88,58"  fill="none" stroke="#F1BF00" stroke-width="11" stroke-linecap="round"/>
  <path d="M 88,58 Q 100,38 112,58" fill="none" stroke="#6A2D72" stroke-width="11" stroke-linecap="round"/>
  <!-- "ince" -->
  <text x="122" y="216"
    font-family="monospace" font-size="90" font-weight="500"
    fill="#6A2D72">ince</text>

  <!-- ══ ICONO SOLO 64px ══ -->
  <path d="M 80,322 L 80,390 L 128,390 L 120,376 L 97,376 L 97,322 Z" fill="#6A2D72"/>
  <path d="M 80,311 Q 87,301 94,311"  fill="none" stroke="#C60B1E" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 94,311 Q 101,321 108,311" fill="none" stroke="#F1BF00" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 108,311 Q 115,301 122,311" fill="none" stroke="#6A2D72" stroke-width="5.5" stroke-linecap="round"/>

  <!-- ══ ICONO SOLO 32px ══ -->
  <path d="M 234,322 L 234,358 L 258,358 L 253,350 L 247,350 L 247,322 Z" fill="#6A2D72"/>
  <path d="M 234,316 Q 238,310 242,316" fill="none" stroke="#C60B1E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 242,316 Q 246,322 250,316" fill="none" stroke="#F1BF00" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 250,316 Q 254,310 258,316" fill="none" stroke="#6A2D72" stroke-width="3.5" stroke-linecap="round"/>

</svg>
