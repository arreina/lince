# 🐆 Lince — integración continua
#
# Dos trabajos: uno comprueba que el lenguaje se comporta como debe y el
# otro repite las mismas suites con AddressSanitizer para cazar errores de
# memoria. Se separan para que al ver un fallo se sepa de inmediato si es
# de lógica o de memoria.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        run: make

      - name: Suite de integración
        run: make test

      - name: Suite del compilador
        run: make test-compilador

      - name: Test de humo del servidor
        run: make test-servidor

      - name: Los ejercicios de examples/ se ejecutan
        run: make test-ejemplos

      - name: Servidor de lenguaje (lince lsp)
        run: make test-lsp

      - name: Soporte de editores
        run: make test-editores

      # Gramática y snippets se generan del lexer: si se añade una palabra al
      # lenguaje y no se regenera, esto falla.
      - name: Depurador
        run: make test-depurador

      - name: Ventana (servidor.ventana)
        run: make test-ventana

      - name: Los editores están al día
        run: make editores-check

      # El manual publica la salida real de cada ejemplo, así que si alguien
      # toca uno sin regenerar —o el lenguaje cambia de comportamiento— la
      # página quedaría mintiendo. Esto lo detecta.
      - name: El manual está al día
        run: make docs-check

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Las mismas suites sobre el binario instrumentado. Es lo que
      # detecta los usos de memoria liberada del intérprete y del módulo
      # 'servidor', que en un build normal pasan desapercibidos o se
      # manifiestan como fallos intermitentes.
      - name: Compilar con AddressSanitizer
        run: make debug

      - name: Suites bajo AddressSanitizer
        run: make test-asan
