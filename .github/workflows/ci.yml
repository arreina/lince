# 🐆 Lince — integración continua
#
# Dos trabajos: uno comprueba que el lenguaje se comporta como debe y el
# otro repite las mismas suites con AddressSanitizer para cazar errores de
# memoria. Se separan para que al ver un fallo se sepa de inmediato si es
# de lógica o de memoria.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        run: make

      - name: Suite de integración
        run: make test

      - name: Suite del compilador
        run: make test-compilador

      - name: Test de humo del servidor
        run: make test-servidor

      - name: Los ejercicios de examples/ se ejecutan
        run: make test-ejemplos

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Las mismas suites sobre el binario instrumentado. Es lo que
      # detecta los usos de memoria liberada del intérprete y del módulo
      # 'servidor', que en un build normal pasan desapercibidos o se
      # manifiestan como fallos intermitentes.
      - name: Compilar con AddressSanitizer
        run: make debug

      - name: Suites bajo AddressSanitizer
        run: make test-asan

  # ── Módulo motor (opt-in) ────────────────────────────────────
  #
  # El módulo 'motor' vive en un build aparte: el `lince` normal no depende
  # de SDL2 ni sabe que existe. Este trabajo compila libmotor.a del repo
  # hermano y pasa el test de humo del binding, que es la única cobertura
  # que tiene — y la que destapó el cuelgue del bucle y las fugas por frame.
  #
  # lince-motor es privado, así que hace falta un PAT con permiso de lectura
  # sobre él, guardado como secreto LINCE_MOTOR_TOKEN. Sin ese secreto el
  # trabajo se salta en vez de fallar: el motor es opt-in y no tiene por qué
  # tumbar la CI de quien no lo use.
  motor:
    name: Módulo motor
    runs-on: ubuntu-latest

    env:
      # Revisión de lince-motor contra la que está verificado el binding.
      # Fijada a propósito, no a 'main': así un cambio en el motor no tumba
      # esta CI por sorpresa. Para subirla: comprueba en local con
      #   make test-motor LINCE_MOTOR_DIR=/ruta/al/lince-motor
      # y cambia este SHA (y el del Makefile) en el mismo commit.
      MOTOR_REV: edffe157719aa97923b7ad7ddfa50d2d32bcef71
      MOTOR_TOKEN: ${{ secrets.LINCE_MOTOR_TOKEN }}

    steps:
      - name: ¿Hay token para el repo del motor?
        id: token
        run: |
          if [ -n "$MOTOR_TOKEN" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin el secreto LINCE_MOTOR_TOKEN me salto el test del motor. Crea un token con acceso de lectura a arreina/lince-motor y guárdalo con ese nombre en los secretos del repo."
          fi

      - name: Traer lince
        if: steps.token.outputs.hay == 'si'
        uses: actions/checkout@v5
        with:
          path: lince

      - name: Traer lince-motor (en la revisión fijada)
        if: steps.token.outputs.hay == 'si'
        uses: actions/checkout@v5
        with:
          repository: arreina/lince-motor
          ref: ${{ env.MOTOR_REV }}
          token: ${{ secrets.LINCE_MOTOR_TOKEN }}
          path: lince-motor

      - name: SDL2
        if: steps.token.outputs.hay == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-image-dev

      # Sólo el target 'motor'. Con los ejemplos y el editor en OFF no entran
      # ni ImGui ni cJSON, así que son ocho .c y un par de segundos.
      - name: Compilar libmotor.a
        if: steps.token.outputs.hay == 'si'
        working-directory: lince-motor
        run: |
          cmake -B build -DMOTOR_EJEMPLOS=OFF -DMOTOR_EDITOR=OFF
          cmake --build build --target motor -j

      # smoke.sh fuerza el driver de vídeo 'dummy' de SDL, así que no hace
      # falta pantalla ni servidor X.
      - name: Test de humo del motor
        if: steps.token.outputs.hay == 'si'
        working-directory: lince
        run: make test-motor LINCE_MOTOR_DIR=../lince-motor
