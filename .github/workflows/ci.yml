# 🐆 Lince — integración continua
#
# Cuatro trabajos: uno comprueba que el lenguaje se comporta como debe, otro
# repite las mismas suites con AddressSanitizer para cazar errores de
# memoria, el tercero lo compila y lo prueba en Windows (MSYS2/UCRT64) y el
# cuarto hace la plantilla de Android (lince-android.apk) y prueba
# 'lince repartir --android' con ella.
#
# Al subir una etiqueta vX.Y.Z, si los cuatro pasan, un quinto publica la
# versión en GitHub: Lince para Linux y para Windows (cada uno con la
# plantilla de Android al lado), la plantilla suelta y la extensión de VS Code,
# con el apartado de NOVEDADES.md de esa versión.

name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        run: make

      - name: Suite de integración
        run: make test

      - name: Suite del compilador
        run: make test-compilador

      - name: Servidor de lenguaje (lince lsp) y revisor
        run: make test-lsp

      - name: Herramientas (formatear, documentar, probar, perfil, paquetes)
        run: make test-herramientas

      - name: Soporte de editores
        run: make test-editores

      # Gramática y snippets se generan del lexer: si se añade una palabra al
      # lenguaje y no se regenera, esto falla.
      - name: Depurador
        run: make test-depurador

      - name: Juego (SDL2 sin pantalla)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0 python3-pil
          make test-juego test-ejemplos

      - name: Escritorio (lince repartir para Linux)
        run: make test-escritorio

      - name: Los editores están al día
        run: make editores-check

      # src/lince/*.lince va dentro del ejecutable como src/biblioteca_*.h
      - name: Las bibliotecas en Lince están al día
        run: make bibliotecas-check

      # El manual publica la salida real de cada ejemplo, así que si alguien
      # toca uno sin regenerar —o el lenguaje cambia de comportamiento— la
      # página quedaría mintiendo. Esto lo detecta.
      - name: El manual está al día
        run: make docs-check

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Las mismas suites sobre el binario instrumentado. Es lo que
      # detecta los usos de memoria liberada del intérprete, que en un build normal pasan desapercibidos o se
      # manifiestan como fallos intermitentes.
      - name: SDL2 para los tests del módulo juego
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0

      - name: Compilar con AddressSanitizer
        run: make debug

      - name: Suites bajo AddressSanitizer
        run: make test-asan

      # Los lectores (JSON, Tiled, imágenes, OGG y el de Lince) con datos
      # estropeados al azar; en local se lanzan más con make fuzz FUZZ_N=...
      - name: Datos estropeados (fuzzing)
        run: make fuzz FUZZ_N=400

  windows:
    name: Windows
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-SDL2

      - name: Compilar
        run: make

      - name: Suite de integración
        run: LINCE_BIN=lince.exe ./lince.exe tests/runner.lince

      - name: Ejecutables (lince compilar)
        run: |
          LINCE_BIN=lince.exe ./lince.exe tests/runner_compilador.lince
          LINCE_BIN=./lince.exe bash tests/compilador/probar_empaquetado.sh

      - name: Servidor de lenguaje
        run: python tests/lsp/smoke.py ./lince.exe

      - name: Revisor (avisos de lince comprobar)
        run: bash tests/revisor/probar.sh ./lince.exe

      - name: Herramientas (formatear, documentar, probar, perfil)
        run: bash tests/herramientas/probar.sh ./lince.exe

      - name: Depurador
        run: bash tests/depurador/smoke.sh ./lince.exe

      - name: Depurador para el IDE (--ide)
        run: bash tests/depurador/ide.sh ./lince.exe

      - name: Juego y minijuegos (SDL2 sin pantalla)
        run: |
          bash tests/juego/smoke.sh ./lince.exe
          bash tests/juego/ejemplos.sh ./lince.exe

      - name: Escritorio (lince repartir, el instalador de verdad)
        run: bash tests/escritorio/probar.sh ./lince.exe

      # Para la versión: lince.exe con SDL2.dll y las DLL de MSYS2 que necesiten
      - name: Lince para Windows
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p windows
          cp lince.exe /ucrt64/bin/SDL2.dll windows/
          ldd lince.exe /ucrt64/bin/SDL2.dll | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u | xargs -r -I{} cp {} windows/
          ls windows

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: lince-windows
          path: windows/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SDL2 del sistema: Lince dibuja el icono de la app (android/icono.lince)
      - name: SDL2
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0

      - name: Compilar Lince
        run: make

      # SDL2 no va en el repositorio: se descargan sus fuentes
      - name: Fuentes de SDL2
        run: |
          curl -sSL -o sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          mkdir -p "$RUNNER_TEMP/SDL2" && tar -xzf sdl2.tar.gz -C "$RUNNER_TEMP/SDL2" --strip-components=1

      # Google Play pide apuntar a Android 16 (API 36)
      - name: Android 16 en el SDK
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      # Con el Java 17, el SDK y el NDK que trae la máquina de GitHub
      - name: Plantilla de Android (lince-android.apk)
        env:
          LINCE_ANDROID: ${{ runner.temp }}/lince-android
          SDL_RUTA: ${{ runner.temp }}/SDL2
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash android/construir.sh --plantilla -o lince-android.apk

      # Lo que hace quien tiene Lince, sin el SDK: el .apk y el .aab de un juego,
      # comprobados con apksigner, jarsigner y bundletool
      - name: lince repartir --android y --aab
        env:
          LINCE_ANDROID_PLANTILLA: lince-android.apk
          BUNDLETOOL: ${{ runner.temp }}/lince-android/descargas/bundletool.jar
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          bash tests/android/repartir.sh ./lince

      - uses: actions/upload-artifact@v4
        with:
          name: lince-android
          path: lince-android.apk

  publicar:
    name: Publicar la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, sanitizer, windows, android]
    # El Ubuntu más antiguo que da GitHub: el lince de Linux sirve así en más
    # sistemas (pide una glibc igual o más nueva que la de donde se compila)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: La etiqueta es la versión de src/version.h
        run: |
          V="$(sed -n 's/^#define LINCE_VERSION "\(.*\)"/\1/p' src/version.h)"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "La etiqueta $GITHUB_REF_NAME no es v$V (src/version.h)"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Compilar Lince
        run: |
          make
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0

      - uses: actions/download-artifact@v4
        with:
          path: descargas

      - name: Paquetes
        run: |
          comun="README.md LICENSE NOVEDADES.md examples"
          plantilla=descargas/lince-android/lince-android.apk
          # Linux
          L="lince-$V-linux"
          mkdir "$L" && cp -r lince $comun "$plantilla" "$L"/
          # SDL2 al lado: lince la usa si el sistema no la tiene, y 'lince repartir
          # --para linux' (desde Windows) la mete en el juego
          cp -L "$(ldconfig -p | awk '/libSDL2-2.0.so.0 .*x86-64/ {print $NF; exit}')" "$L"/libSDL2-2.0.so.0
          tar -czf "$L.tar.gz" "$L"
          # Windows
          W="lince-$V-windows"
          mkdir "$W" && cp -r descargas/lince-windows/* $comun "$plantilla" "$W"/
          zip -qr "$W.zip" "$W"
          # La plantilla suelta y la extensión de VS Code
          cp "$plantilla" .
          make vsix
          # Las notas: el apartado de esta versión en NOVEDADES.md
          awk -v v="## $V" '$0 == v {dentro=1; next} /^## / {dentro=0} dentro' NOVEDADES.md > notas.md
          [ -s notas.md ] || { echo "NOVEDADES.md no tiene el apartado '## $V'"; exit 1; }
          ls -l *.tar.gz *.zip *.apk build/*.vsix

      - name: Versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Lince $V" --notes-file notas.md \
            "lince-$V-linux.tar.gz" "lince-$V-windows.zip" lince-android.apk build/*.vsix
